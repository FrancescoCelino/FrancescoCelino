<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per la mia micia</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7e8ff;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #9c27b0;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }
        
        .cat-image {
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            max-width: 100%;
        }
        
        .cat-image img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .password-section {
            margin-top: 30px;
        }
        
        .password-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #6a1b9a;
        }
        
        input {
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid #ce93d8;
            border-radius: 5px;
            margin-right: 10px;
            outline: none;
        }
        
        input:focus {
            border-color: #9c27b0;
        }
        
        button {
            background-color: #9c27b0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background-color: #6a1b9a;
        }
        
        .gift-section {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background-color: #f5e9fa;
            display: none;
        }
        
        .gift-title {
            color: #9c27b0;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        .steam-key {
            font-family: monospace;
            font-size: 1.3rem;
            padding: 15px;
            background-color: #e1bee7;
            border-radius: 5px;
            letter-spacing: 1px;
            margin: 10px 0;
        }
        
        .hearts {
            font-size: 1.5rem;
            margin: 20px 0;
            color: #e91e63;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dedicato alla mia micia</h1>
        
        <div class="cat-image">
            <!-- Qui puoi inserire la tua gif di gatto -->
            <img src="cute-cat-white.gif" alt="Gattino carino">
        </div>
        
        <div class="password-section">
            <p class="password-text">Inserire la parola d'ordine per ricevere il tuo regalo:</p>
            <input type="password" id="passwordInput" placeholder="Parola d'ordine...">
            <button id="checkPassword">Verifica</button>
        </div>
        
        <div class="gift-section" id="giftSection">
            <div class="hearts">❤️ 🎮 ❤️</div>
            <p class="gift-title">Ecco il tuo regalo :3</p>
            <p>Inserisci questa key su Steam:</p>
            <div class="steam-key" id="steamKey">XXXXX-XXXXX-XXXXX</div>
            <p>Ti amo</p>
            <div class="hearts">❤️ 🎮 ❤️</div>
        </div>
    </div>
    
    <script>
        // Imposta qui la parola d'ordine e la Steam key
        const correctPassword = "micia"; // Cambia questa con la tua parola d'ordine
        const steamKeyValue = "ABCDE-FGHIJ-KLMNO"; // Sostituisci con la tua vera Steam key
        
        document.getElementById('checkPassword').addEventListener('click', checkPasswordFunc);
        document.getElementById('passwordInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkPasswordFunc();
            }
        });
        
        function checkPasswordFunc() {
            const passwordInput = document.getElementById('passwordInput').value;
            const giftSection = document.getElementById('giftSection');
            const steamKey = document.getElementById('steamKey');
            
            if (passwordInput.toLowerCase() === correctPassword.toLowerCase()) {
                steamKey.textContent = steamKeyValue;
                giftSection.style.display = 'block';
                
                // Aggiungi un effetto di scrolling verso il regalo
                setTimeout(() => {
                    giftSection.scrollIntoView({behavior: 'smooth'});
                }, 300);
            } else {
                alert('Parola d\'ordine errata! Riprova.');
            }
        }
    </script>
</body>
</html>
